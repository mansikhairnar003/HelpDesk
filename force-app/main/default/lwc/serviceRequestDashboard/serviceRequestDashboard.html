<template>
    <lightning-card title="Open Service Requests" icon-name="standard:case">

        <template if:true={requests}>
            <div class="slds-p-around_medium">

                <template for:each={requests} for:item="request">
                    <div key={request.Id} class="slds-box slds-m-bottom_small">

                        <p>
                            <strong>{request.Name}</strong>
                        </p>

                        <p>
                            Subject: {request.Subject__c}
                        </p>

                        <p>
                            Category: {request.Category__c}
                        </p>

                        <p>
                            Priority: {request.Priority__c}
                        </p>

                        <p>
                            Status: {request.Status__c}
                        </p>

                    </div>
                </template>

            </div>
        </template>

        <template if:true={error}>
            <div class="slds-p-around_medium">
                Unable to load Service Requests.
            </div>
        </template>

    </lightning-card>
</template>

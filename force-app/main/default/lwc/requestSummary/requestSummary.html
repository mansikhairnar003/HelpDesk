<template>
    <div class="slds-grid slds-wrap slds-gutters">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <article class="summary-box">
                <div class="summary-label">Open Requests</div>
                <div class="summary-value">{openCount}</div>
            </article>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <article class="summary-box">
                <div class="summary-label">Critical Requests</div>
                <div class="summary-value">{criticalCount}</div>
            </article>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <article class="summary-box">
                <div class="summary-label">Resolved </div>
                <div class="summary-value">{resolvedCount}</div>
            </article>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <article class="summary-box">
                <div class="summary-label">SLA Risk</div>
                <div class="summary-value">{slaRisk}</div>
            </article>
        </div>
    </div>
</template>
